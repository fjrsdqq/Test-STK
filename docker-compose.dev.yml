services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: menu_user
      POSTGRES_PASSWORD: menu_password
      POSTGRES_DB: menu_tree
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U menu_user -d menu_tree"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data: